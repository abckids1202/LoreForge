services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loreforge
      POSTGRES_PASSWORD: loreforge
      POSTGRES_DB: loreforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://loreforge:loreforge@postgres:5432/loreforge
      SECRET_KEY: replace-with-a-long-random-secret
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
